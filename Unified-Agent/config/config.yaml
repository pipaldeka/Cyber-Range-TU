# Unified AI Agent Configuration

agent:
  name: "unified-ai-agent"
  version: "1.0.0"
  log_level: "INFO"

docker:
  socket: "unix:///var/run/docker.sock"
  monitor_networks:
    - "vlan-*"  # Monitor all VLAN networks
  stats_interval: 5  # seconds

database:
  host: "10.10.0.12"
  port: 5432
  database: "unified_agent"
  user: "agent"
  password: "${DB_PASSWORD}"  # From environment
  pool_size: 10

queue:
  max_size: 10000
  batch_size: 100
  flush_interval: 5  # seconds

detection:
  rules_file: "config/detection_rules.yaml"
  confidence_threshold: 0.7

ai:
  provider: "openai"  # openai, anthropic, local
  model: "gpt-4o"
  api_key: "${OPENAI_API_KEY}"
  max_tokens: 1000
  temperature: 0.3
  enabled: true
  batch_analysis: true  # Analyze multiple events together

scoring:
  base_points:
    FLAG_CAPTURE: 200
    STRUTS2_EXPLOIT: 100
    REVERSE_SHELL: 150
    SQL_INJECTION: 80
    DIRECTORY_TRAVERSAL: 50
    PRIVILEGE_ESCALATION: 120
  
  multipliers:
    quality_excellent: 1.5
    quality_good: 1.2
    quality_average: 1.0
    quality_poor: 0.7
    first_blood: 2.0
    speed_bonus: 1.3
  
  penalties:
    failed_attempt: -10
    hint_used: -20
    noisy_exploit: -30

blueteam:
  auto_response: true
  isolation_on_critical: true
  alert_webhook: "${SLACK_WEBHOOK}"
  forensic_path: "/forensic"

monitoring:
  prometheus_port: 9100
  health_check_port: 8000

